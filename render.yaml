services:
  - type: web
    name: ofertas-plataformas
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:css
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "24"
